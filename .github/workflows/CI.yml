name: CI

on:
  # Tests are run LOCALLY before every push (the full matrix: `julia +1.11` 1-thread +
  # `julia +release` 4-thread, via juliaup). GitHub Actions test runs are deliberately kept OFF
  # to avoid CI cost — this workflow is MANUAL-ONLY (`workflow_dispatch`), with no push or tag
  # trigger; only the docs workflow runs automatically (on push). Trigger this by hand from the
  # Actions tab when a from-scratch clean-environment resolve is wanted (e.g. before a release).
  workflow_dispatch:

jobs:
  test:
    name: Julia ${{ matrix.version }} — ${{ matrix.threads }} thread(s)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.11'   # the package's minimum (compat floor)
            threads: '1'
          - version: '1'      # current stable, threaded lane
            threads: '4'

    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads }}
