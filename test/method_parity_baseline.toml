# Method-parity baseline, read by GBGCodingTools.TestHarness.method_parity from test/method_parity.jl.
# The package DECLARES method parity to the tool (RULE.TEST.METHOD_PARITY); these are its frozen numbers,
# and a moved number is refrozen deliberately, in the same commit as the change, with the reason beside it.
#
# Two tables, counting DIFFERENT denominators, which must not be compared:
# - [[generic]]: the public surface — for each operation a user can call, the number of methods the named
#   module defines for it (a scalar and a vector query-point method give 2; `merge!` has its abstract
#   fallback in Accumulators and the two concrete summaries' methods in Histograms). `write_histogram` /
#   `read_histogram` are bare generics whose methods live in the HDF5 extension, not in a package module.
# - [module]: the derived count — every method each module owns over the package's whole function
#   surface, internals included, so a method added anywhere moves a number.
#
# Frozen 2026-10-03 at the wiring (GBGCodingTools v2.0.0-rc.57), Julia 1.12.

